[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comettrace"

# Package version 0.38.0 introduces the v0.38 patch layer (engine_v038.py,
# schema_version 0.38) while keeping legacy_engine.py (schema_version 0.37)
# byte-identical and invokable via --engine v037.
version = "0.38.4"

description = "Open-source forensic tool for reconstructing Perplexity Comet Browser Control and Computer-mode behavior from IndexedDB LevelDB artifacts."

readme = "README.md"
requires-python = ">=3.10,<3.13"

authors = [
  { name = "Kyongho Gong" },
  { name = "Jihun Joun" }
]

license = { text = "Apache-2.0" }

keywords = [
  "digital-forensics",
  "browser-forensics",
  "leveldb",
  "indexeddb",
  "agentic-ai",
  "perplexity-comet",
  "behavior-reconstruction"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security"
]

# ccl_chromium_reader and ccl_simplesnappy are not installed from PyPI.
# They are installed from the post-hoc revalidation commits pinned in:
#
#   scripts/install_ccl_dependencies.ps1
#   scripts/install_ccl_dependencies.sh
#   release_manifest.json
#
# These pinned commits define the documented post-hoc revalidation
# environment. They are not claimed to be the unrecorded revisions used for
# the original paper-associated outputs.
#
# Brotli, zstandard, and zstd are decompression dependencies required by the
# LevelDB parsing environment. ccl_chromium_reader imports the zstd module at
# load time.

dependencies = [
  "Brotli>=1.1.0,<=1.2.0",
  "zstandard>=0.22.0",
  "zstd==1.5.7.2"
]

[project.scripts]
comettrace = "comettrace.cli:main"

[project.urls]
Repository = "https://github.com/KyonghoGong/CometTrace"
Issues = "https://github.com/KyonghoGong/CometTrace/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
