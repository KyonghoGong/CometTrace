name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  freeze-package-and-import:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install pinned forensic dependencies
        run: |
          python scripts/install_ccl_dependencies.py

      - name: Install CometTrace
        run: |
          python -m pip install .
          python -m pip check

      - name: Compile Python source
        run: |
          python -m compileall -q \
            src \
            tests \
            tools \
            comet_browser_reconstruct.py

      - name: Verify installed engine digests
        run: |
          python -m comettrace.provenance

      - name: Check both source engines against the release manifest
        run: python tools/verify_release.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check for unfinished release placeholders
        run: |
          python - <<'PY'
          from pathlib import Path


          files_to_check = [
              Path("README.md"),
              Path("pyproject.toml"),
              Path("release_manifest.json"),
              Path("scripts/install_ccl_dependencies.sh"),
              Path("scripts/install_ccl_dependencies.ps1"),
          ]

          forbidden_text = [
              "AUTHOR ACTION",
              "refs/heads/master.zip",
          ]

          failures = []

          for path in files_to_check:
              text = path.read_text(encoding="utf-8")

              for forbidden in forbidden_text:
                  if forbidden in text:
                      failures.append(
                          f"{path}: contains {forbidden!r}"
                      )

          if failures:
              raise SystemExit(
                  "\n".join(failures)
              )

          print("release placeholder check: PASS")
          PY

      - name: Verify CCL parser imports
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import ccl_chromium_reader
          import ccl_simplesnappy


          print(
              "ccl_chromium_reader:",
              version("ccl-chromium-reader"),
          )

          print(
              "ccl_simplesnappy:",
              version("ccl-simplesnappy"),
          )

          print("CCL import check: PASS")
          PY

      - name: Verify console entry point
        run: |
          python - <<'PY'
          from importlib.metadata import entry_points


          scripts = entry_points(
              group="console_scripts"
          )

          script_names = {
              entry.name
              for entry in scripts
          }

          assert "comettrace" in script_names

          print(
              "console entry point: comettrace"
          )

          print("entry-point registration: PASS")
          PY

      - name: Verify CLI import and help
        run: |
          comettrace --help > /dev/null

          echo "CLI import and help: PASS"

      - name: Report CI validation scope
        run: |
          echo "This CI verifies:"
          echo "- supported Python versions"
          echo "- pinned dependency installation"
          echo "- frozen and patched engine SHA-256 integrity"
          echo "- unit tests and dependency consistency"
          echo "- package and manifest consistency"
          echo "- CCL parser imports"
          echo "- CometTrace CLI registration"
          echo ""
          echo "This CI does not reproduce the paper's numerical results"
          echo "because raw research acquisitions are not included in"
          echo "the public source-code repository."
